<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Water &amp; Food Tracker</title>
<link rel="preload" as="image" href="cow.png?v=3">
<link rel="preload" as="image" href="login-bg.jpg">
<link rel="stylesheet" href="style.css?v=16">
<link rel="stylesheet" href="login.css?v=3">
</head>
<body class="locked">

<main id="pages">

  <section class="page show" id="page1" aria-label="Weekly intake">
    <div class="dash">

      <!-- left column: clock, calendar, mood bars, note box -->
      <div class="col left">
        <div class="grp gl">
        <div class="clock reveal" id="clock" style="--dx:-110px;--i:1" aria-label="Current time in Sri Lanka">
          <div class="tile" id="t-h"><span class="lab l" id="ampm"></span></div>
          <div class="tile" id="t-m"><span class="lab r" id="wday"></span></div>
        </div>

        <div class="cal reveal" id="cal" style="--dx:-110px;--i:2">
          <div class="cal-head">
            <button type="button" class="cn" id="cprev" aria-label="Previous month" data-pop>&lt;</button>
            <button type="button" class="ctitle" id="ctitle" title="Back to today"></button>
            <button type="button" class="cn" id="cnext" aria-label="Next month" data-pop>&gt;</button>
          </div>
          <div class="cal-body-wrap">
            <div class="wd"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
            <div class="cal-body" id="calBody"></div>
          </div>
        </div>
        </div>

        <div class="bars reveal lift" id="bars" style="--dy:90px;--i:3"></div>

        <div class="note reveal lift" id="note" style="--dy:90px;--i:5">
          <label for="noteIn">Anything She Wants To Say Or Talk About?</label>
          <textarea id="noteIn" rows="4" maxlength="1000" placeholder="Type anything here..." enterkeyhint="send"></textarea>
          <div class="nfoot"><small>Woah she's typing something here? Sus</small><button type="button" class="qbtn" id="noteBtn" data-pop>Save</button></div>
        </div>
      </div>

      <!-- centre column: heading, water + food + poop + quote cards, chart, poop chart -->
      <div class="col mid">
        <div class="grp gm">
        <div class="band reveal" style="--dy:-70px;--i:0"><h1>Nati's Dashboard</h1><span id="sel-label"></span></div>
        <div class="cards" id="cards"></div>
        </div>

        <div class="chartcard c1 reveal" style="--dy:90px;--i:6">
          <div class="chead">
            <div class="csum">
              <div class="cs-l"><b id="cs-name"></b><small id="cs-sub"></small></div>
              <div class="cs-r"><strong id="cs-val"></strong><em id="cs-delta"></em></div>
            </div>
            <div class="tabs" id="tabs" role="tablist"></div>
          </div>
          <div class="plot" id="plot"><svg id="svg" role="img" aria-label="Intake chart"></svg><div class="tip" id="tip" hidden></div></div>
        </div>
      </div>

      <!-- right column: Today's Log (the cow sits on its top-right edge) -->
      <div class="col right">
        <div class="qwrap reveal" style="--dx:110px;--i:4">
          <!-- the cow: .cow is the fixed spot on the card edge; the three wrappers inside carry the bounce, sway and breathing, and the picture itself does the wiggle (see the "Cow" block in style.css) -->
          <div class="cow" role="img" aria-label="A seated orange Highland cow">
            <div class="cow-bob">
              <div class="cow-tilt">
                <div class="cow-breath">
                  <img class="cow-art" src="cow.png?v=3" width="80" height="96" alt="" draggable="false" decoding="async" onerror="this.style.display='none'">
                </div>
              </div>
            </div>
          </div>
          <h2>Today's Log</h2>
          <small class="qdate" id="qdate"></small>
          <div class="qbox"><ul id="qlist"></ul></div>
        </div>

        <!-- Daily Reward: the cat grows with today's progress (2,000 ml water = 50%, 3 meals = 50%) -->
        <div class="reward reveal lift" id="reward" style="--dx:110px;--i:7">
          <h2>Daily Reward</h2>
          <div class="rwpct" id="rwPct" role="img" aria-label="Daily reward progress 0%"></div>
          <div class="rwcat">
            <div class="cat" id="rwCat" aria-hidden="true">
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            <div class="cat__segment"></div>
            </div>
          </div>
          <button type="button" class="qbtn rwplay" id="rwPlay" disabled>Play Game</button>
        </div>
      </div>

    </div>
  </section>

</main>

<!-- two koi fish: they rest beside the cow; tap a fish and both swim around the dashboard (see the "Two koi" block in style.css) -->
<div id="pond" class="rest" aria-hidden="true">
    <div class="fish">
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
    </div>
    <div class="fish">
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
    </div>
</div>

<!-- Daily puzzle: full-screen jigsaw that unlocks when the Daily Reward cat reaches 100% -->
<div id="puz" class="puz" hidden role="dialog" aria-modal="true" aria-label="Daily puzzle">
  <div class="puz-top"><b>Daily Puzzle</b><span id="puzInfo"></span><button type="button" class="puz-x" id="puzClose" aria-label="Close puzzle">&times;</button></div>
  <div class="puz-stage" id="puzStage"></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<!-- LOGIN: pink picture + frosted glass box. Covers everything until the right password is entered (checked by Code.gs against the "Password" tab). -->
<div id="login" class="login" role="dialog" aria-modal="true" aria-label="Login">
  <div class="lg-bg"></div>
  <div class="lg-box">
    <h1>Welcome</h1>
    <form class="lg-form" id="lgForm" autocomplete="off" novalidate>
      <label for="lgPass">Password</label>
      <div class="lg-field">
        <input type="password" id="lgPass" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
        <button type="button" class="lg-eye" id="lgEye" aria-label="Show password" aria-pressed="false">
          <svg class="on" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.1 4M6.3 6.4C3.6 8.1 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
        </button>
      </div>
      <p class="lg-msg" id="lgMsg" role="alert" aria-live="assertive"></p>
      <button type="submit" class="lg-btn" id="lgBtn">Enter</button>
    </form>
  </div>
</div>

<script src="app.js?v=12"></script>
<script src="login.js?v=2"></script>
</body>
</html>
