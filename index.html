<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Water &amp; Food Tracker</title>
<link rel="preload" as="image" href="cow.png?v=3">
<link rel="preload" as="image" href="media/background-poster.jpg?v=1">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>

<!-- looping background video: sits behind every card and chart (files live in the "media" folder) -->
<video id="bgvid" class="bgvid" src="media/background.mp4?v=1" poster="media/background-poster.jpg?v=1" autoplay muted loop playsinline preload="auto" disablepictureinpicture aria-hidden="true" tabindex="-1"></video>

<main id="pages">

  <section class="page show" id="page1" aria-label="Weekly intake">
    <div class="dash">

      <!-- left column: clock, calendar, mood bars, note box -->
      <div class="col left">
        <div class="clock reveal" id="clock" style="--dx:-110px;--i:1" aria-label="Current time in Sri Lanka">
          <div class="tile" id="t-h"><span class="lab l" id="ampm"></span></div>
          <div class="tile" id="t-m"><span class="lab r" id="wday"></span></div>
        </div>

        <div class="cal reveal" id="cal" style="--dx:-110px;--i:2">
          <div class="cal-head">
            <button type="button" class="cn" id="cprev" aria-label="Previous month" data-pop>&#8249;</button>
            <button type="button" class="ctitle" id="ctitle" title="Back to today"></button>
            <button type="button" class="cn" id="cnext" aria-label="Next month" data-pop>&#8250;</button>
          </div>
          <div class="cal-body-wrap">
            <div class="wd"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
            <div class="cal-body" id="calBody"></div>
          </div>
        </div>

        <div class="bars reveal" id="bars" style="--dy:90px;--i:3"></div>

        <div class="note reveal lift" id="note" style="--dy:90px;--i:5">
          <label for="noteIn">Anything She Wants To Say Or Talk About?</label>
          <textarea id="noteIn" rows="4" maxlength="1000" placeholder="Type anything here..." enterkeyhint="send"></textarea>
          <div class="nfoot"><small>Enter to save · Shift+Enter for a new line</small><button type="button" class="qbtn" id="noteBtn" data-pop>Save</button></div>
        </div>
      </div>

      <!-- centre column: heading, water + food + poop + quote cards, chart, poop chart -->
      <div class="col mid">
        <div class="band reveal" style="--dy:-70px;--i:0"><h1>weekly intake</h1><span id="sel-label"></span></div>
        <div class="cards" id="cards"></div>

        <div class="chartcard reveal" style="--dy:90px;--i:6">
          <div class="chead">
            <div class="csum">
              <div class="cs-l"><b id="cs-name"></b><small id="cs-sub"></small></div>
              <div class="cs-r"><strong id="cs-val"></strong><em id="cs-delta"></em></div>
            </div>
            <div class="tabs" id="tabs" role="tablist"></div>
          </div>
          <div class="plot" id="plot"><svg id="svg" role="img" aria-label="Intake chart"></svg><div class="tip" id="tip" hidden></div></div>
        </div>
      </div>

      <!-- right column: Today's Log (the cow sits on its top-right edge) -->
      <div class="col right">
        <div class="qwrap reveal" style="--dx:110px;--i:4">
          <img class="cow" src="cow.png?v=3" width="80" height="96" alt="A seated orange Highland cow" draggable="false" decoding="async" onerror="this.style.display='none'">
          <h2>Today's Log</h2>
          <small class="qdate" id="qdate"></small>
          <div class="qbox"><ul id="qlist"></ul></div>
        </div>
      </div>

    </div>
  </section>

</main>

<!-- two koi fish: they rest beside the cow; tap a fish and both swim around the dashboard (see the "Two koi" block in style.css) -->
<div id="pond" class="rest" aria-hidden="true">
    <div class="fish">
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
    </div>
    <div class="fish">
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
      <div class="koiCoil"></div>
    </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<!-- background video helper: keeps it muted and playing; people who prefer reduced motion get a still frame; if the file is missing the page just shows its orange backdrop -->
<script>
(function () {
  var v = document.getElementById('bgvid'); if (!v) return;
  v.muted = true; v.defaultMuted = true;
  v.addEventListener('error', function () { v.style.display = 'none'; });
  if (window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches) { v.removeAttribute('autoplay'); v.pause(); return; }
  var go = function () { var p = v.play(); if (p && p.catch) p.catch(function () {}); };
  go();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) go(); });   // resume after the tab was hidden
  document.addEventListener('pointerdown', go, { once: true });                                   // phones in low-power mode may wait for the first touch
})();
</script>
<script src="app.js?v=4"></script>
</body>
</html>
